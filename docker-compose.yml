name: ledgerlite

# Daily development:   docker compose up -d                                   (Postgres only, run the app from your IDE)
# Nginx + API stack:   docker compose --profile full up -d --build --wait     http://localhost:8081
# Single image:        docker compose --profile single up -d --build --wait   http://localhost:8082
#                      (the exact image that is deployed to Render: API and React app in one service)
# The full and single profiles need JWT_SECRET in a .env file (see .env.example).

services:
  postgres:
    image: postgres:16-alpine
    container_name: ledgerlite-postgres
    environment:
      POSTGRES_DB: ledgerlite
      POSTGRES_USER: ledgerlite
      POSTGRES_PASSWORD: ledgerlite_dev
    ports:
      - "5455:5432"
    volumes:
      - ledgerlite-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerlite -d ledgerlite"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ledgerlite
      DB_USERNAME: ledgerlite
      DB_PASSWORD: ledgerlite_dev
      # No default on purpose: the backend refuses to start with a missing or short secret.
      JWT_SECRET: ${JWT_SECRET:-}
      COOKIE_SECURE: "false"      # plain http on localhost; set to "true" behind HTTPS
      COOKIE_SAMESITE: Lax
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  frontend:
    profiles: ["full"]
    build:
      context: ./frontend
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  app:
    profiles: ["single"]
    build:
      context: .
      dockerfile: Dockerfile.render
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ledgerlite
      DB_USERNAME: ledgerlite
      DB_PASSWORD: ledgerlite_dev
      JWT_SECRET: ${JWT_SECRET:-}
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: Lax
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

volumes:
  ledgerlite-pgdata:
