name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Testcontainers 1.19 speaks Docker API 1.32; newer Docker engines require at least 1.44.
      - name: Let Testcontainers talk to newer Docker engines
        run: echo "api.version=1.44" >> ~/.docker-java.properties

      - name: Run unit and integration tests
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:no-any
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  docker-nginx-stack:
    name: Docker stack smoke test (Nginx + API)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Create a throwaway .env
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" > .env

      - name: Build and start the full stack
        run: docker compose --profile full up -d --build --wait --wait-timeout 240

      - name: Smoke test through Nginx
        run: bash scripts/smoke-test.sh http://localhost:8081

      - name: Show container logs on failure
        if: failure()
        run: docker compose --profile full logs --no-color

      - name: Tear down
        if: always()
        run: docker compose --profile full down -v

  docker-single-image:
    name: Single image smoke test (the Render image)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Create a throwaway .env
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" > .env

      - name: Build and start the single image (API and React app together)
        run: docker compose --profile single up -d --build --wait --wait-timeout 240

      - name: Smoke test the single image
        run: bash scripts/smoke-test.sh http://localhost:8082

      - name: Show container logs on failure
        if: failure()
        run: docker compose --profile single logs --no-color

      - name: Tear down
        if: always()
        run: docker compose --profile single down -v
