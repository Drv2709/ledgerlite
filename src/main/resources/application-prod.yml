# Active only in the deployed image (Dockerfile.render sets SPRING_PROFILES_ACTIVE=prod).
# No defaults here on purpose: a missing variable stops the app at startup with
# "Could not resolve placeholder", instead of silently using localhost or a public dev secret.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
    cookie:
      secure: ${COOKIE_SECURE:true}
